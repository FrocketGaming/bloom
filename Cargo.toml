[package]
name = "bloom"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A text expander for Windows with a fast, clean snippet search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FrocketGaming/bloom"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-segmentation = "1.13.3"

# Windows-only: listening, typing and window focus all live behind
# src/platform/, so the rest of the crate is ready for another target.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_TextServices"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Smaller and faster release builds. panic stays "unwind" on purpose: a panic in
# the engine thread then stops only that thread instead of the whole tray app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
