[package]
name = "bloom"
version = "0.1.0"
edition = "2024"
description = "A text expander for Windows with a fast, clean snippet search"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
toml = "1.2.1"
toml_edit = "0.25.19"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_TextServices"] }

[build-dependencies]
tauri-build = "2.7.4"
