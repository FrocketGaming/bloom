name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a
# draft GitHub Release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in tauri.conf.json"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run tests
        run: cargo test --locked

      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          ## Install

          Download **$($installer.Name)** below and run it. No admin rights are needed.

          Windows may show "Windows protected your PC" because the installer isn't code-signed yet. Click **More info**, then **Run anyway**.

          SHA-256: ``$hash``
          "@
          gh release create "${{ github.ref_name }}" $installer.FullName `
            --draft --verify-tag --title "Bloom ${{ github.ref_name }}" --notes $notes --generate-notes
